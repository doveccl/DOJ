services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: doj
      POSTGRES_USER: doj
      POSTGRES_PASSWORD: doj
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doj -d doj"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - valkey:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: doj
      MINIO_ROOT_PASSWORD: doj-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DATABASE: "postgres://doj:doj@postgres:5432/doj"
      REDIS: "redis://valkey:6379/0"
      STORAGE: "http://doj:doj-minio-password@minio:9000/doj"
    ports:
      - "28080:7974"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7974/api/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  judger:
    profiles:
      - judger
    build:
      context: .
      dockerfile: Dockerfile.judger
    restart: unless-stopped
    privileged: true
    pid: host
    cgroup: host
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER: "http://server:7974"
      TOKEN: "replace-with-judger-token"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/doj:/var/lib/doj

volumes:
  postgres:
  valkey:
  minio:
