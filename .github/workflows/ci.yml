name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API client
        run: |
          pnpm api:gen
          git diff --exit-code -- web/client/schema.ts

      - name: Run Go tests
        run: go test -short $(go list ./... | grep -v /judger$)

      - name: Run frontend checks
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Check compose
        run: docker compose config >/tmp/doj-compose.yml

      - name: Build release binaries
        run: |
          mkdir -p .local/build
          CGO_ENABLED=0 go build -o .local/build/doj .

      - name: Scan for private local details
        run: |
          git grep -nE '10\.0\.|/Users/|NAS|MacBook' -- . \
            ':!go.sum' \
            ':!pnpm-lock.yaml' \
            ':!web/dist/**' \
            ':!.github/workflows/ci.yml' > /tmp/doj-local-hits || true
          if [ -s /tmp/doj-local-hits ]; then
            cat /tmp/doj-local-hits
            echo "Unexpected private local host or path found"
            exit 1
          fi
