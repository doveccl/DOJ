services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: doj
      POSTGRES_USER: doj
      POSTGRES_PASSWORD: doj
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doj -d doj"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - valkey:/data

  server:
    image: doveccl/doj:4
    command: ["doj", "server"]
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      DATABASE: "postgres://doj:doj@postgres/doj"
      REDIS: "redis://valkey/0"
      STORAGE: "/storage"
    ports:
      - "7974:7974"
    volumes:
      - ./storage:/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7974/api/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  judger:
    image: doveccl/doj:4
    command: ["doj", "judger"]
    restart: unless-stopped
    pid: host
    cgroup: host
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    network_mode: service:server
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/doj:/var/lib/doj

volumes:
  postgres:
  valkey:
