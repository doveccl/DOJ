openapi: 3.1.0
info:
  title: DOJ Web API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          description: Server health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/ready:
    get:
      operationId: ready
      responses:
        "200":
          description: Server dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Server dependencies are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/events:
    get:
      operationId: watchEvents
      responses:
        "200":
          description: Server-sent events for lightweight live updates
          content:
            text/event-stream:
              schema:
                type: string
  /api/site:
    get:
      operationId: getSite
      responses:
        "200":
          description: Public site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
  /api/me:
    get:
      operationId: getMe
