components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Site:
      type: object
      required: [siteName, registration, guest, defaultPublicSource]
      properties:
        siteName:
          type: string
        registration:
          type: boolean
        guest:
          type: boolean
        defaultPublicSource:
          type: boolean
    HeatCell:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
        count:
          type: integer
    Item:
      type: object
      required: [id, title, meta]
      properties:
        id:
          type: integer
        title:
          type: string
        meta:
          type: string
    Me:
      type: object
      required: [id, name, mail, bio, avatar, admin]
      properties:
        id:
          type: integer
        name:
          type: string
        mail:
          type: string
          format: email
        bio:
          type: string
          maxLength: 280
        avatar:
          type: string
          maxLength: 512
        admin:
          type: boolean
    MeUpdate:
      type: object
      required: [mail, bio, avatar]
      properties:
        mail:
          type: string
        bio:
          type: string
        avatar:
          type: string
    LoginRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [name, mail, password]
      properties:
        name:
          type: string
        mail:
          type: string
        password:
          type: string
    Lang:
      type: object
      required: [id, name, source]
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
    UploadResult:
      type: object
      required: [url]
      properties:
        url:
          type: string
    PasswordUpdate:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
    AdminOverview:
      type: object
